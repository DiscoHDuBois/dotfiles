# Font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures cursor

# Finestra
background_opacity        0.85
window_padding_width      10 16
remember_window_size      no
initial_window_width      120c
initial_window_height     30c
confirm_os_window_close   0
enable_audio_bell         no
hide_window_decorations   yes
wayland_titlebar_color    background

# Cursore
cursor_shape              block
cursor_blink_interval     0
cursor                    #f8f9ee
cursor_text_color         #2c2e3a

# Tab
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       round
active_tab_background     #ba94f1
active_tab_foreground     #2c2e3a
active_tab_font_style     bold
inactive_tab_background   #3a3d4e
inactive_tab_foreground   #9aa0bd

# Colori
foreground            #cdd2ea
background            #2c2e3a
selection_foreground  #2c2e3a
selection_background  #8ae4fd
url_color             #8ae4fd
url_style             curly

