# mpv

# ── Interfaccia (uosc) ──
osc=no
osd-bar=no
border=no
title=${?media-title:${media-title}}${!media-title:mpv}
keepaspect-window=no
autofit-larger=90%x90%
background-color="#2c2e3a"
cursor-autohide=1000

# ── OSD ──
osd-font="MesloLGS NF"
osd-font-size=30
osd-color="#cdd2ea"
osd-border-color="#2c2e3a"
osd-border-size=2
osd-shadow-offset=0
osd-bold=yes
osd-duration=1500
osd-playing-msg=${media-title}
osd-playing-msg-duration=2000

# ── Video (AMD Radeon 860M) ──
vo=gpu-next
gpu-api=vulkan
hwdec=vaapi
profile=high-quality
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
video-sync=display-resample
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=5

# ── Audio ──
volume=80
volume-max=150
audio-file-auto=fuzzy
alang=jpn,ja,ita,it,eng,en

# ── Sottotitoli ──
slang=ita,it,eng,en
sub-auto=fuzzy
sub-font="Noto Sans"
sub-bold=yes
sub-font-size=44
sub-color="#ffffff"
sub-border-color="#2c2e3a"
sub-border-size=2.6
sub-shadow-offset=1
sub-shadow-color="#a02c2e3a"
sub-margin-y=40
sub-fix-timing=yes
# Stile sopra solo su .srt/.vtt, .ass dei fansub intatti
sub-ass-override=no

# ── Streaming / cache ──
cache=yes
demuxer-max-bytes=800MiB
demuxer-max-back-bytes=200MiB
demuxer-readahead-secs=900
cache-pause-initial=yes
cache-pause-wait=3
network-timeout=15
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# ── Comodità ──
save-position-on-quit=yes
watch-later-options-remove=sid,aid,volume
keep-open=no
screenshot-format=png
screenshot-png-compression=7
screenshot-directory=~/Immagini/mpv
screenshot-template=%F-%P
